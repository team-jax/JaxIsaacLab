seed: 42
models:
  separate: true
  policy:
    class: GaussianMixin
    clip_actions: true
    clip_log_std: true
    min_log_std: -5.0
    max_log_std: 1.0
    initial_log_std: -1.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ACTIONS
  critic_1: &critic
    class: DeterministicMixin
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [256, 256]
        activations: elu
    output: ONE
  critic_2:
    <<: *critic
  target_critic_1:
    <<: *critic
  target_critic_2:
    <<: *critic
memory:
  class: RandomMemory
  memory_size: 64
agent:
  class: SAC
  gradient_steps: 1
  batch_size: 2048
  discount_factor: 0.99
  polyak: 0.005
  learning_rate: 0.0001
  random_timesteps: 32
  learning_starts: 32
  learn_entropy: true
  initial_entropy_value: 0.1
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  experiment:
    directory: one_arm_jax_pick_place_v1
    experiment_name: ''
    write_interval: 8
    checkpoint_interval: 800
trainer:
  class: SequentialTrainer
  timesteps: 1600
  environment_info: log
